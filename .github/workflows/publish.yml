name: Release and publish

on:
  push:
    branches: [main]
  # Manual re-run: dispatch against a v* tag to retry a failed upload or
  # release step. PyPI rejects re-uploading an existing version.
  workflow_dispatch:

permissions: {}

jobs:
  # Opens or refreshes the release pull request on every push to main. When
  # that pull request is merged, the same job creates the v* tag and a draft
  # GitHub Release instead. Tags created with GITHUB_TOKEN do not trigger
  # other workflows, which is why publishing lives in this file.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # release-please rebuilds its branch from main on every run, so the
      # changelog heading and the lockfile are re-applied after each rebuild.
      - name: Check out the release branch
        if: steps.rp.outputs.prs_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}

      - name: Install uv
        if: steps.rp.outputs.prs_created == 'true'
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.10.6"

      - name: Date the changelog and refresh uv.lock
        if: steps.rp.outputs.prs_created == 'true'
        env:
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          # Move the hand-written Unreleased notes under a dated version
          # heading and leave an empty Unreleased heading above them.
          python3 - "$VERSION" "$(date -u +%F)" <<'PY'
          import pathlib
          import sys

          version, date = sys.argv[1], sys.argv[2]
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()
          heading = f"## [{version}] - "
          if heading in text:
              sys.exit(0)
          marker = "## [Unreleased]\n"
          start = text.find(marker)
          if start == -1:
              sys.exit("CHANGELOG.md has no '## [Unreleased]' heading")
          body_start = start + len(marker)
          nxt = text.find("\n## [", body_start)
          body = text[body_start : nxt if nxt != -1 else len(text)]
          if not body.strip():
              sys.exit("The Unreleased section is empty: write the release notes first")
          path.write_text(text[:body_start] + f"\n{heading}{date}\n" + text[body_start:])
          PY
          # Records the new project version; existing pins stay as they are.
          uv lock
          git add CHANGELOG.md uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: date the changelog and refresh uv.lock for $VERSION"
          git push origin "HEAD:$BRANCH"

  build-and-publish:
    needs: release-please
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the explicit go for PyPI:
    # the job waits here until a reviewer approves the deployment.
    environment:
      name: pypi
      url: https://pypi.org/p/poppy-memory
    permissions:
      contents: read
      id-token: write   # OIDC token for PyPI Trusted Publishing (no stored API token)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify build metadata
        run: python -m twine check dist/*

      # Uploaded before the publish step: PyPI versions are immutable, so a
      # re-run after a successful publish cannot get past it to retry the upload.
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Publishes the draft release left by release-please: the changelog section
  # as notes, the published wheel + sdist attached.
  github-release:
    needs: [release-please, build-and-publish]
    if: >-
      !cancelled() && needs.build-and-publish.result == 'success' &&
      (needs.release-please.outputs.tag_name != '' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # edit the release and upload its assets
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Extract changelog section for this version
        run: |
          VERSION="${TAG#v}"
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section for tag $TAG"
            exit 1
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md --draft=false
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md
          fi
