name: Feature request
description: Suggest an idea or an improvement for Poppy.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like Poppy to do. Alternatives you considered are welcome too.
